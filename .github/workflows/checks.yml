name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Check Python
        run: |
          ruff check src tests scripts main.py migrations
          ruff format --check src tests scripts main.py migrations
          pytest -q
      - name: Check frontend
        run: node tests/frontend_simulation_smoke.cjs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Start stack
        env:
          POSTGRES_PASSWORD: ci_demo_password
        run: |
          docker compose up --build -d --wait --wait-timeout 180
          timeout 30s sh -c 'until docker compose logs mqtt-consumer | grep -q "Subscribed to:"; do sleep 1; done'
      - name: Replay engine 1
        run: python3 scripts/check_stack.py
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
        env:
          POSTGRES_PASSWORD: ci_demo_password
      - name: Stop stack
        if: always()
        run: docker compose down -v
        env:
          POSTGRES_PASSWORD: ci_demo_password
