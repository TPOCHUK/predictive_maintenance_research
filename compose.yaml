services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: predictive-maintenance-app:local
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://ml_user:${POSTGRES_PASSWORD}@postgres:5432/maintenance
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: maintenance
      POSTGRES_USER: ml_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml_user -d maintenance"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    restart: unless-stopped

  mqtt-consumer:
    image: predictive-maintenance-app:local
    restart: unless-stopped
    init: true
    # This container runs MQTT, so the image's API healthcheck does not apply.
    healthcheck:
      disable: true
    command: python -m predictive_maintenance.mqtt.consumer
    environment:
      DATABASE_URL: postgresql+psycopg://ml_user:${POSTGRES_PASSWORD}@postgres:5432/maintenance
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      API_BASE_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  postgres_data:
  mosquitto_data:
